<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Orca — Painel de Cenários{% endblock %}</title>
    <!-- Tailwind CDN + HTMX CDN — sem build step -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        /* Mobile-first, max-width 640px, touch targets 48px */
        .container { max-width: 640px; margin: 0 auto; padding: 1rem; }
        .btn { @apply px-4 py-3 rounded-lg font-medium text-base touch-target; min-height: 48px; }
        .btn-primary { @apply bg-blue-600 text-white hover:bg-blue-700; }
        .btn-secondary { @apply bg-gray-200 text-gray-800 hover:bg-gray-300; }
        .btn-success { @apply bg-green-600 text-white hover:bg-green-700; }
        .btn-danger { @apply bg-red-600 text-white hover:bg-red-700; }
        .btn:disabled { @apply opacity-50 cursor-not-allowed; }
        .card { @apply bg-white rounded-xl shadow-md p-4 mb-4; }
        .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-lg text-base; min-height: 48px; }
        .label { @apply block text-sm font-medium text-gray-700 mb-1; }
        .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
        .badge-success { @apply bg-green-100 text-green-800; }
        .badge-warning { @apply bg-yellow-100 text-yellow-800; }
        .badge-error { @apply bg-red-100 text-red-800; }
        .badge-info { @apply bg-blue-100 text-blue-800; }
        .table-container { @apply overflow-x-auto; }
        table { @apply w-full text-sm; }
        th { @apply px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider bg-gray-50; }
        td { @apply px-3 py-2 border-t border-gray-100; }
        tr:hover { @apply bg-gray-50; }
        .status-completo { @apply text-green-600 font-medium; }
        .status-incompleto { @apply text-red-600 font-medium; }
        .htmx-indicator { @apply inline-block h-4 w-4 animate-spin border-2 border-blue-600 border-t-transparent rounded-full; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
