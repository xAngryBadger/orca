<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Orca — Painel de Cenários{% endblock %}</title>
    <!-- Tailwind CDN + HTMX CDN + Geist (Vercel) via fontsource — sem build step -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.1.0/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.1.0/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.1.0/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.1.0/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.1.0/500.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0a0a0a',
                        panel: '#111111',
                        panel2: '#161616',
                        line: 'rgba(255,255,255,0.08)',
                        line2: 'rgba(255,255,255,0.14)',
                        txt: '#ededed',
                        muted: '#888888',
                        faint: '#555555',
                        accent: '#5e8bff',
                        ok: '#3ecf8e',
                        err: '#f06a6a',
                        warn: '#e8b34b',
                    },
                    fontFamily: {
                        sans: ['"Geist Sans"', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['"Geist Mono"', 'ui-monospace', 'Consolas', 'monospace'],
                    },
                },
            },
        };
    </script>
    <style>
        :root { --ease-out: cubic-bezier(0.16, 1, 0.3, 1); }
        html { scrollbar-color: #2a2a2a #0a0a0a; }
        body { background: #0a0a0a; color: #ededed; font-family: 'Geist Sans', system-ui, sans-serif; }

        .panel { background: #111111; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; }

        .btn {
            min-height: 36px; border-radius: 6px; font-weight: 500; font-size: 0.83rem;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
            transition: background .15s var(--ease-out), border-color .15s var(--ease-out), color .15s var(--ease-out);
            border: 1px solid transparent; cursor: pointer; padding: 0 0.9rem;
        }
        .btn:disabled { opacity: .4; cursor: not-allowed; }
        .btn-primary { background: #ededed; color: #0a0a0a; }
        .btn-primary:not(:disabled):hover { background: #ffffff; }
        .btn-accent { background: #5e8bff; color: #ffffff; }
        .btn-accent:not(:disabled):hover { background: #6f98ff; }
        .btn-ghost { background: transparent; color: #ededed; border-color: rgba(255,255,255,0.12); }
        .btn-ghost:not(:disabled):hover { background: #1a1a1a; border-color: rgba(255,255,255,0.2); }
        .btn-danger { background: transparent; color: #f06a6a; border-color: rgba(240,106,106,.3); }
        .btn-danger:not(:disabled):hover { background: rgba(240,106,106,.08); }

        .input-field {
            background: #0a0a0a; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            color: #ededed; height: 36px; padding: 0 0.7rem; width: 100%; font-size: 0.85rem;
            transition: border-color .15s var(--ease-out), box-shadow .15s var(--ease-out);
        }
        .input-field:focus { outline: none; border-color: rgba(94,139,255,.6); box-shadow: 0 0 0 3px rgba(94,139,255,.15); }
        .label { display: block; font-size: 0.72rem; font-weight: 500; color: #888888; margin-bottom: 0.35rem; }

        .badge { display: inline-flex; align-items: center; padding: 0.1rem 0.55rem; border-radius: 999px; font-size: 0.68rem; font-weight: 500; }
        .badge-ok { background: rgba(62,207,142,.12); color: #3ecf8e; }
        .badge-err { background: rgba(240,106,106,.12); color: #f06a6a; }
        .badge-muted { background: rgba(255,255,255,.06); color: #888888; }

        .section-title {
            font-size: 0.72rem; font-weight: 600; color: #888888;
            text-transform: uppercase; letter-spacing: 0.08em;
            padding-bottom: 0.7rem; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }

        table { width: 100%; font-size: 0.8rem; border-collapse: collapse; }
        th { text-align: left; padding: 0.55rem 0.7rem; color: #888888; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em; border-bottom: 1px solid rgba(255,255,255,0.08); font-weight: 500; }
        td { padding: 0.55rem 0.7rem; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ededed; }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background .12s var(--ease-out); }
        tbody tr:hover { background: #161616; }

        .htmx-indicator { display: none; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.2); border-top-color: currentColor; border-radius: 50%; animation: spin .6s linear infinite; }
        .htmx-request .htmx-indicator { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .rise { opacity: 0; animation: fadeup .25s var(--ease-out) forwards; }

        @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
        ::selection { background: rgba(94,139,255,.3); }
    </style>
</head>
<body class="min-h-screen antialiased">
    <!-- Topbar -->
    <header class="sticky top-0 z-10 border-b border-line bg-bg/90 backdrop-blur">
        <div class="max-w-5xl mx-auto px-5 h-14 flex items-center gap-2.5">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3C8 7.5 5.5 10.4 5.5 13.5a6.5 6.5 0 0 0 13 0C18.5 10.4 16 7.5 12 3Z" stroke="#ededed" stroke-width="1.5"/>
                <path d="M12 20v-7" stroke="#ededed" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="font-semibold text-[0.95rem] tracking-tight">Orca</span>
            <span class="text-muted text-xs hidden sm:inline">· console de cenários</span>
            <span class="ml-auto font-mono text-[0.7rem] text-faint">sessão {{ session_id }}</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-5 py-7">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
